# Local streaming platform (M1 steps 2-3). See ADRs 0013, 0015-0018, 0020.
#
#   Flink SQL jobs ──► Kafka topics ──► materialization job (Flink SQL, pure copy) ──► Iceberg tables
#                          │                                                             │
#        Schema Registry (Avro schemas)      Iceberg REST catalog (table registry) · RustFS (S3: data files)
#
# Host ports: Kafka 9092 · Schema Registry 8085 · RustFS S3 9000, console 9001 · Iceberg REST 8181
#             · Flink UI 8081

x-s3-credentials: &s3-credentials
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-asm-local}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-asm-local-secret}
  AWS_REGION: us-east-1

services:
  kafka:
    image: apache/kafka:4.4.0
    ports:
      - "9092:9092"
    environment:
      # Single node acting as both broker and KRaft controller (no ZooKeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two client listeners: containers use kafka:19092, the host uses localhost:9092.
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # One broker, so internal topics cannot be replicated.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:19092"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # Confluent Schema Registry (ADR 0020): stores the Avro schemas of every topic's keys and
  # values in the `_schemas` topic. Host port 8085, since Flink's UI already uses 8081.
  schema-registry:
    image: confluentinc/cp-schema-registry:8.4.0
    ports:
      - "8085:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:19092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      # The image has no curl: send a minimal HTTP request with bash and expect a 200.
      test:
        - CMD
        - bash
        - -c
        - >
          exec 3<>/dev/tcp/127.0.0.1/8081
          && printf 'GET /subjects HTTP/1.0\r\n\r\n' >&3
          && head -1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  rustfs:
    image: rustfs/rustfs:1.0.4
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-asm-local}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-asm-local-secret}
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # One-shot: create the bucket that holds the Iceberg warehouse.
  rustfs-init:
    image: amazon/aws-cli:2.39.6
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      <<: *s3-credentials
    entrypoint: ["sh", "-c"]
    command:
      - >
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket warehouse 2>/dev/null
        || aws --endpoint-url http://rustfs:9000 s3 mb s3://warehouse
    restart: "no"

  # Apache's reference Iceberg REST catalog (ADR 0016). Table registry kept in SQLite on a volume.
  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    ports:
      - "8181:8181"
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    environment:
      <<: *s3-credentials
      CATALOG_URI: jdbc:sqlite:/home/iceberg/iceberg.db
      CATALOG_JDBC_USER: user
      CATALOG_JDBC_PASSWORD: password
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://rustfs:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    volumes:
      # Mounted on the image's home dir (owned by the non-root `iceberg` user) so a fresh
      # named volume inherits that ownership and SQLite can write to it.
      - iceberg-catalog:/home/iceberg
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8181/v1/config"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # Flink: the JobManager plans and coordinates jobs, the TaskManager runs them.
  # SQL is submitted with the SQL client inside the JobManager container.
  jobmanager:
    build: docker/flink
    image: agentic-semantic-mesh/flink:2.2.1
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      <<: *s3-credentials
      FLINK_PROPERTIES: &flink-properties |
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 1g
        taskmanager.memory.process.size: 2g
        taskmanager.numberOfTaskSlots: 4
        execution.checkpointing.interval: 10s
    depends_on:
      kafka:
        condition: service_healthy
      iceberg-rest:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/overview"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  taskmanager:
    image: agentic-semantic-mesh/flink:2.2.1
    command: taskmanager
    environment:
      <<: *s3-credentials
      FLINK_PROPERTIES: *flink-properties
    depends_on:
      jobmanager:
        condition: service_healthy
    healthcheck:
      # Healthy once the JobManager lists this TaskManager (it identifies them by IP),
      # so `up --wait` also waits for registration.
      test: ["CMD-SHELL", "curl -fsS http://jobmanager:8081/taskmanagers | grep -q \"$$(hostname -i)\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  kafka-data:
  rustfs-data:
  iceberg-catalog:
